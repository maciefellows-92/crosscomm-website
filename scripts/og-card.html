<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CrossComm social card</title>
    <style>
      html,
      body {
        margin: 0;
      }
      .card {
        width: 1200px;
        height: 630px;
        background: #273743;
        position: relative;
        overflow: hidden;
      }
      .rule {
        position: absolute;
        top: 0;
        left: 0;
        width: 1200px;
        height: 8px;
        background: #a64b2a;
      }
      img {
        position: absolute;
        left: 72px;
        top: 210px;
        width: 480px;
        height: auto;
      }
      p {
        position: absolute;
        left: 72px;
        bottom: 88px;
        margin: 0;
        color: #fcfdfe;
        font-family: Georgia, "Iowan Old Style", serif;
        font-size: 64px;
        line-height: 1;
        letter-spacing: -0.03em;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="rule"></div>
      <img src="../client/public/logo.png" width="676" height="129" alt="" />
      <p>Make the next thing.</p>
    </div>
  </body>
</html>
